name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install make -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"

      - name: make check
        shell: bash
        run: |
          if ! command -v make >/dev/null 2>&1; then
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/.local/bin/python3"
            chmod +x "$HOME/.local/bin/python3"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          make --version
          make SHELL="$(command -v bash)" check
