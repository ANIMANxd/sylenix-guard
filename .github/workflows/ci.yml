name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install make -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"

      - name: make check
        shell: bash
        run: |
          if ! command -v make >/dev/null 2>&1; then
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/.local/bin/python3"
            chmod +x "$HOME/.local/bin/python3"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          set +e
          {
            echo "make: $(command -v make || true)"
            make --version || true
            echo "bash: $(command -v bash || true)"
            make SHELL="$(command -v bash)" check
          } > /tmp/make-check.log 2>&1
          rc=$?
          cat /tmp/make-check.log
          if [ "$rc" -ne 0 ]; then
            {
              grep -n -E "FAIL|Traceback|make: \\*\\*\\*|Error|error:" /tmp/make-check.log || true
              tail -25 /tmp/make-check.log
            } | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$rc"
